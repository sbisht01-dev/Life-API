<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life API — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            zinc: {
              950: '#09090b',
              900: '#121215',
              850: '#18181b',
              800: '#27272a'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen selection:bg-zinc-800">

  <!-- Navigation Bar -->
  <header class="border-b border-zinc-800/80 bg-zinc-950/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-2.5 w-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></div>
        <span class="text-sm font-semibold tracking-tight text-zinc-200">LIFE OS <span class="text-zinc-600">/</span> TELEMETRY</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="fetchTelemetry()" class="text-xs font-mono px-3 py-1.5 rounded-md border border-zinc-800 bg-zinc-900 hover:bg-zinc-800/80 text-zinc-300 transition-colors flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Sync Now
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">
    
    <!-- Top Metric Grid -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Card: Current Status -->
      <div class="p-5 rounded-xl border border-zinc-800/80 bg-zinc-900/50 relative overflow-hidden">
        <div class="text-xs font-medium uppercase tracking-wider text-zinc-500">Current Device State</div>
        <div class="mt-3 flex items-center gap-3">
          <span id="state-ping" class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          <span id="device-status" class="text-xl font-semibold text-zinc-100 font-mono tracking-tight">Active</span>
        </div>
        <p id="last-updated" class="mt-2 text-xs text-zinc-500 font-mono">Syncing...</p>
      </div>

      <!-- Card: Total Unlocks Today -->
      <div class="p-5 rounded-xl border border-zinc-800/80 bg-zinc-900/50">
        <div class="text-xs font-medium uppercase tracking-wider text-zinc-500">Unlocks (Today)</div>
        <div class="mt-3 flex items-baseline gap-2">
          <span id="unlock-count" class="text-3xl font-bold font-mono tracking-tight text-zinc-100">0</span>
          <span class="text-xs text-zinc-500 font-mono">sessions</span>
        </div>
        <p class="mt-2 text-xs text-zinc-500 font-mono">Filtered since midnight</p>
      </div>

      <!-- Card: Estimated Screen Time -->
      <div class="p-5 rounded-xl border border-zinc-800/80 bg-zinc-900/50">
        <div class="text-xs font-medium uppercase tracking-wider text-zinc-500">Est. Screen Time (Today)</div>
        <div class="mt-3 flex items-baseline gap-2">
          <span id="screen-time" class="text-3xl font-bold font-mono tracking-tight text-zinc-100">0m</span>
        </div>
        <p class="mt-2 text-xs text-zinc-500 font-mono">Calculated session deltas</p>
      </div>

    </section>

    <!-- Activity Log Table -->
    <section class="rounded-xl border border-zinc-800/80 bg-zinc-900/30 overflow-hidden">
      <div class="px-6 py-4 border-b border-zinc-800/80 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-200 tracking-tight">Live Event Telemetry</h3>
        <span id="log-count" class="text-xs font-mono text-zinc-500">0 records</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs font-mono">
          <thead class="bg-zinc-950/60 border-b border-zinc-800/80 text-zinc-500 font-medium">
            <tr>
              <th class="px-6 py-3">Timestamp</th>
              <th class="px-6 py-3">Event State</th>
              <th class="px-6 py-3">Relative Time</th>
              <th class="px-6 py-3 text-right">Payload ID</th>
            </tr>
          </thead>
          <tbody id="events-table-body" class="divide-y divide-zinc-800/50 text-zinc-300">
            <tr>
              <td colspan="4" class="px-6 py-8 text-center text-zinc-600">Awaiting stream connection...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const API_URL = "https://api-fargvgjnga-uc.a.run.app/events";

    async function fetchTelemetry() {
      try {
        const response = await fetch(API_URL);
        const json = await response.json();
        
        if (json.status !== "success" || !json.data) return;

        const events = json.data;
        renderDashboard(events);
      } catch (err) {
        console.error("Telemetry fetch error:", err);
      }
    }

    function renderDashboard(events) {
      if (!events || events.length === 0) return;

      const latest = events[0];
      const isUnlocked = latest.event === "Device Unlocked";
      
      // Update Device Status Badge
      const statusEl = document.getElementById("device-status");
      const pingEl = document.getElementById("state-ping");
      statusEl.innerText = isUnlocked ? "Device Unlocked" : "Device Locked";
      
      if (isUnlocked) {
        pingEl.innerHTML = `
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        `;
      } else {
        pingEl.innerHTML = `<span class="relative inline-flex rounded-full h-3 w-3 bg-zinc-600"></span>`;
      }

      document.getElementById("last-updated").innerText = `Last event: ${new Date(latest.createdAt).toLocaleTimeString()}`;
      document.getElementById("log-count").innerText = `${events.length} records loaded`;

      const today = new Date().toDateString();
      const todayEvents = events.filter(e => e.createdAt && new Date(e.createdAt).toDateString() === today);
      
      const unlocksToday = todayEvents.filter(e => e.event === "Device Unlocked").length;
      document.getElementById("unlock-count").innerText = unlocksToday;

      
      let totalMs = 0;
      const chronological = [...todayEvents].reverse();
      let lastUnlockTime = null;

      for (const ev of chronological) {
        if (ev.event === "Device Unlocked") {
          lastUnlockTime = new Date(ev.createdAt).getTime();
        } else if (ev.event === "Device Locked" && lastUnlockTime) {
          const delta = new Date(ev.createdAt).getTime() - lastUnlockTime;
          if (delta > 0 && delta < 1000 * 60 * 60 * 6) { 
            totalMs += delta;
          }
          lastUnlockTime = null;
        }
      }

      const totalMins = Math.round(totalMs / (1000 * 60));
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      document.getElementById("screen-time").innerText = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

      const tbody = document.getElementById("events-table-body");
      tbody.innerHTML = events.map(e => {
        const time = e.createdAt ? new Date(e.createdAt) : null;
        const isUnlock = e.event === "Device Unlocked";

        return `
          <tr class="hover:bg-zinc-900/50 transition-colors">
            <td class="px-6 py-3 text-zinc-400">${time ? time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—'}</td>
            <td class="px-6 py-3">
              <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-medium border ${
                isUnlock 
                  ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                  : 'bg-zinc-800 text-zinc-400 border-zinc-700/50'
              }">
                ${e.event}
              </span>
            </td>
            <td class="px-6 py-3 text-zinc-500">${time ? timeAgo(time) : '—'}</td>
            <td class="px-6 py-3 text-right font-mono text-zinc-600">${e.id.substring(0, 8)}...</td>
          </tr>
        `;
      }).join("");
    }

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    // Auto-fetch on load and poll every 30s
    fetchTelemetry();
    setInterval(fetchTelemetry, 30000);
  </script>
</body>
</html>
